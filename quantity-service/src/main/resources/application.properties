spring.application.name=quantity-service

server.port=8082

# ==========================
# H2 Database (file-based, persists across restarts)
# ==========================
spring.datasource.url=jdbc:h2:file:./data/quantitydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Only seed schema.sql/data.sql on a fresh database
spring.sql.init.mode=never

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# JWT (validate-only — must match auth-service's jwt.secret exactly)
# ===============================
jwt.secret=MySuperSecretKeyForQuantityMeasurementApplication2026

app.frontend-url=http://localhost:5173
